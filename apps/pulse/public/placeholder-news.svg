<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pulsing gradient background directly from PulseLogo (blue-500 to purple-600 with 20% opacity) -->
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.20" />
    </linearGradient>
  </defs>

  <!-- Neutral base background -->
  <rect width="400" height="200" fill="#F3F4F6" />

  <!-- PulseLogo full background container -->
  <rect x="0" y="0" width="400" height="200" fill="url(#pulseGlow)" />

  <!-- Exact HeartbeatLogo mark from HeartbeatLogo.tsx centered inside gradient container -->
  <g transform="translate(136, 64) scale(1.28)">
    <svg viewBox="0 0 100 40" width="100" height="40">
      <path
        d="M 0 20 L 15 20 L 18 10 L 22 30 L 26 15 L 30 20 L 45 20 L 48 10 L 52 30 L 56 15 L 60 20 L 75 20 L 78 10 L 82 30 L 86 15 L 90 20 L 100 20"
        stroke="#2563EB"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <animate
          attributeName="stroke-dasharray"
          from="0,200"
          to="200,0"
          dur="2s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values="0.6;1;0.6"
          dur="2s"
          repeatCount="indefinite"
        />
      </path>
    </svg>
  </g>

  <!-- Branded Segmento Pulse typography positioned below the heartbeat container -->
  <text
    x="200"
    y="134"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="2"
    fill="#1E293B"
  >
    SEGMENTO <tspan fill="#2563EB">PULSE</tspan>
  </text>
</svg>
